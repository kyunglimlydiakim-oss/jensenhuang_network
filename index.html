<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[젠슨 황 네트워크] Jensen Huang Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2430;--sub:#5b6472;--mute:#9098a4;--blue:#24508f;--nv:#1f4f9a;--jen:#d9590f;--cut:#c2410c;--line:#b9c0ca;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 45% 45%,#ffffff 0%,#f3f4f6 55%,#e4e7eb 100%)}
#net{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:default}
/* edges */
.edge{fill:none;stroke:#7f8996;stroke-width:.8;stroke-opacity:.42;vector-effect:non-scaling-stroke;transition:stroke-opacity .6s,stroke .4s,stroke-width .4s}
.edge.nv{stroke-opacity:.30}
.edge.jen{stroke:#c9773f;stroke-opacity:.55}
.edge.dying{stroke:var(--jen)!important;stroke-opacity:1;stroke-width:2.2}
.edge.gone{stroke-opacity:0!important;pointer-events:none}
.edge.cutedge{stroke:var(--cut);stroke-dasharray:3 4;stroke-opacity:.6}
.hovering .edge{stroke-opacity:.12}
.hovering .edge.hl{stroke:var(--ink);stroke-opacity:.9;stroke-width:1.4}
body.layers .edge{stroke-opacity:.6}
/* particles */
.pt{fill:var(--blue);opacity:.8}
.pt.jen{fill:var(--jen)}
/* nodes */
.node{cursor:pointer;transition:opacity .7s}
.node .halo{fill:var(--blue);opacity:0;transition:opacity .3s}
.node .ring{fill:#fff;stroke:#3a5a8c;stroke-width:1.1;vector-effect:non-scaling-stroke;transition:stroke .4s,fill .4s}
.node .core{fill:#3a5a8c;transition:fill .4s}
.node.t-person .ring{stroke:#2d4f86}
.node.t-government .ring{stroke:#6b7686}
.node.t-government .core{fill:#6b7686}
.node.t-event .ring{fill:#f3f4f6;stroke:#9aa3af;stroke-dasharray:2 2}
.node.t-foundation .ring,.node.t-institution .ring{stroke:#7a8aa3}
.node.nv .ring{fill:var(--nv);stroke:#fff;stroke-width:2.5}
.node.nv .core{fill:#fff}
.node.nv .halo{opacity:.12;fill:var(--nv)}
.node.jh .ring{fill:#fff;stroke:var(--jen);stroke-width:3}
.node.jh .core{fill:var(--jen)}
.node.jh .halo{opacity:.16;fill:var(--jen)}
.node:hover .halo,.node.me .halo{opacity:.22}
.hovering .node{opacity:.35}
.hovering .node.me,.hovering .node.nb{opacity:1}
.node.dying{opacity:.0;transition:opacity .7s}
.node.gone{opacity:.08!important}
.node.gone .ring{stroke-dasharray:2 2}
.node.cut .ring{stroke:var(--cut);stroke-width:2;stroke-dasharray:3 2;fill:#fff4ec}
.node.cut .core{fill:var(--cut)}
.node.cut .halo{opacity:.18;fill:var(--cut)}
.node.far .ring{stroke:#e8913f;stroke-width:1.8}
.node.far .halo{opacity:.18;fill:#f2a65a}
.pulse{fill:none;stroke:var(--jen);stroke-width:2;vector-effect:non-scaling-stroke}
/* labels */
.lab{font-size:calc(11px * var(--s,1));fill:#4a5361;paint-order:stroke;stroke:#f5f6f8;stroke-width:calc(3.5px * var(--s,1));stroke-linejoin:round;opacity:0;pointer-events:none;transition:opacity .4s}
.lab.on{opacity:.9}
.lab.jh{fill:var(--jen);font-weight:900;font-size:calc(15px * var(--s,1))}
.lab.nv{fill:var(--nv);font-weight:900;font-size:calc(15px * var(--s,1))}
.lab.hv{opacity:1;fill:var(--ink);font-weight:700}
.lab.cut{opacity:1;fill:var(--cut);font-weight:900;font-size:calc(13px * var(--s,1))}
.lab.cut.many{font-size:calc(10px * var(--s,1));font-weight:700;opacity:.85}
.lab.gone,.lab.dying{opacity:0!important}
/* overlay */
.title{position:fixed;left:28px;top:24px;max-width:460px;pointer-events:none}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--ink);padding:3px 9px;border-radius:2px}
.title h1{font-family:"Noto Serif KR",serif;font-weight:900;font-size:34px;line-height:1.2;margin:10px 0 6px;letter-spacing:-.02em}
.title h1 em{font-style:normal;color:var(--jen)}
.title p{margin:0;font-size:13.5px;color:var(--sub);line-height:1.55}
.panel{position:fixed;right:20px;top:20px;bottom:20px;width:330px;background:rgba(255,255,255,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(29,36,48,.1);border-radius:10px;padding:18px 18px 14px;overflow:auto;box-shadow:0 10px 40px rgba(29,36,48,.08)}
.panel h2{font-size:12px;letter-spacing:.06em;color:var(--mute);margin:0 0 8px;font-weight:700}
.scs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.sc{font:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:6px;border:1px solid #d5d9df;background:#fff;color:var(--ink);cursor:pointer;transition:all .2s}
.sc:hover{border-color:var(--ink)}
.sc.jh{color:var(--jen)} .sc.nv{color:var(--nv)}
.sc.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc.jh.active{background:var(--jen);border-color:var(--jen)} .sc.nv.active{background:var(--nv);border-color:var(--nv)}
#rm-name{font-size:17px;font-weight:900;margin:2px 0 4px}
#rm-desc{font-size:12.5px;color:var(--sub);line-height:1.55;margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.st{background:#f6f7f9;border-radius:6px;padding:8px 10px}
.st .k{font-size:11px;color:var(--sub)}
.st .v{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--jen)}
.st .v.big{color:var(--nv)}
.lists h3{font-size:12.5px;margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.lists h3 i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px dashed var(--cut);background:#fff4ec}
.lists h3 i.far{border:2px solid #e8913f;background:#fde8d4}
.lists ul{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:190px;overflow:auto}
.lists li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #eceef1}
.lists li span{color:var(--mute);white-space:nowrap}
.lists li.none{color:var(--mute);justify-content:flex-start}
.foot{font-size:11px;color:var(--mute);line-height:1.55;margin-top:12px;border-top:1px solid #e3e6ea;padding-top:10px}
.lt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:12px;cursor:pointer}
#legend-layers{display:none;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--sub);margin-top:6px}
body.layers #legend-layers{display:flex}
#legend-layers i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:3px}
.legend{position:fixed;left:28px;bottom:20px;display:flex;gap:14px;font-size:11.5px;color:var(--sub);pointer-events:none;flex-wrap:wrap;max-width:calc(100vw - 400px)}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid #3a5a8c;background:#fff}
#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .15s;background:rgba(29,36,48,.94);color:#fff;border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:240px;z-index:5}
#tip b{display:block;font-size:13.5px}
#tip span{display:block;color:#c8cdd5}
#tip em{display:block;font-style:normal;color:#f6b585;margin-top:3px}

.edge.past{stroke:#9aa3af!important;stroke-dasharray:4 4;stroke-opacity:.75;stroke-width:1.2}
/* 합치기 */
.mbtn{width:100%;font:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:6px;border:1px dashed #d9590f;background:#fff;color:#d9590f;cursor:pointer;margin:0 0 8px}
.mbtn.active{background:#d9590f;color:#fff;border-style:solid}
#merge-box{background:#fdf4ed;border:1px solid #f4dcc9;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:12px;color:var(--sub)}
#merge-box h3{font-size:12.5px;color:var(--ink);margin:8px 0 3px}
#merge-box p{margin:0;line-height:1.55}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mstats div{background:#fff;border-radius:6px;padding:6px 8px;font-weight:900;font-size:15px;color:var(--ink)}
.mstats i{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--sub)}
.mstats small{display:block;font-size:10px;font-weight:500;color:var(--mute)}
.mstats b.j{color:#d9590f}
body.merged .sc.jh,body.merged .sc[data-k="both"]{display:none}
body.merged .node.nv .ring{stroke:#d9590f;stroke-width:4}
.node.viaj .ring{stroke:#d9590f;stroke-width:2}
.node.viaj .halo{opacity:.18;fill:#d9590f}
/* 임원 */
.edge.aug{stroke-dasharray:5 4;stroke:#7a5cc4;stroke-opacity:.8}
#ex-list{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.ex{font:inherit;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid #c7ccd4;background:#fff;color:#1d2430;cursor:pointer}
.ex:hover{border-color:#1f4f9a}
.ex.active{background:#1f4f9a;color:#fff;border-color:#1f4f9a}
.ex.miss{border-style:dashed;color:#8a8f98}
#ex-card:not(:empty){background:#f3f6fb;border:1px solid #dbe3f0;border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:12.5px}
#ex-card b{font-size:15px;display:block}
#ex-card span{color:var(--sub);font-size:12px}
#ex-card p{margin:6px 0 0;color:var(--sub);line-height:1.5}
.exs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.exs div{background:#fff;border-radius:6px;padding:6px 8px;font-weight:900;font-size:15px;color:#1f4f9a}
.exs i{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--sub)}
.exs small{display:block;font-size:10.5px;font-weight:500;color:var(--mute)}
.exrm{margin-top:8px;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid #d9590f;background:#fff;color:#d9590f;cursor:pointer}
.augl{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--sub);margin:0 0 8px;cursor:pointer}
body.focusing .node{opacity:.15}
body.focusing .node.fc,body.focusing .node.fnb{opacity:1}
body.focusing .node.fc .halo{opacity:.3;fill:#1f4f9a}
body.focusing .edge{stroke-opacity:.05}
body.focusing .edge.fce{stroke:#1f4f9a;stroke-opacity:.9;stroke-width:1.8}
body.focusing .lab{opacity:0}
body.focusing .lab.fcl{opacity:1;fill:#1d2430;font-weight:700}
body.focusing .pt{visibility:hidden}
/* 한국 */
.kbtn{width:100%;font:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:6px;border:1px dashed #1f6f5c;background:#fff;color:#1f6f5c;cursor:pointer;margin:0 0 8px}
.kbtn.active{background:#1f6f5c;color:#fff;border-style:solid}
#korea-box{background:#f2f8f5;border:1px solid #d3e8de;border-radius:8px;padding:10px 12px;margin:0 0 12px}
#korea-box h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
#korea-box h3 span{font-weight:400;font-size:11px;color:var(--mute)}
.kt{width:100%;border-collapse:collapse;font-size:12px}
.kt td{padding:3px 2px;border-bottom:1px solid #e3eee9;text-align:right;white-space:nowrap}
.kt td:first-child{text-align:left;font-weight:700}
.kt td small{font-weight:400;color:var(--mute);margin-left:5px}
.kt tr.gh td{font-weight:900;color:#1f6f5c;border-bottom:1.5px solid #1f6f5c;padding-top:7px;text-align:left}
.kt td.big{font-weight:900}
#korea-box .nt{font-size:11px;color:var(--mute);line-height:1.5;margin:6px 0 0}
.hull{fill:#1f6f5c;fill-opacity:.07;stroke:#1f6f5c;stroke-opacity:.45;stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.hlab{font-size:calc(12px * var(--s,1));font-weight:900;fill:#1f6f5c;text-anchor:middle;paint-order:stroke;stroke:#f5f6f8;stroke-width:calc(3px * var(--s,1))}
body.korea .node{opacity:.1}
body.korea .node.kr,body.korea .node.cut{opacity:1}
body.korea .node.gone{opacity:.08!important}
body.korea .edge{stroke-opacity:.04}
body.korea .edge.kre{stroke-opacity:.6;stroke-width:1.3}
body.korea .edge.kre.jen{stroke:#d9590f;stroke-opacity:.8}
body.korea .edge.kre.nv{stroke:#1f4f9a;stroke-opacity:.7}
body.korea .lab{opacity:0}
body.korea .lab.krl{opacity:1;fill:#1d2430;font-weight:700}
body.korea .lab.krl.jh{fill:#d9590f}body.korea .lab.krl.nv{fill:#1f4f9a}
body.korea .pt{visibility:hidden}
/* 조직 단위 */
.obtn{width:100%;font:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:6px;border:1px dashed #5b6472;background:#fff;color:#1d2430;cursor:pointer;margin:-6px 0 8px}
.obtn.active{background:#1d2430;color:#fff;border-style:solid}
.onote{font-size:11.5px;color:#5b6472;line-height:1.5;margin:0 0 12px;background:#f3f4f6;border-radius:6px;padding:8px 10px}
/* 중국 경로 모드 */
.cbtn{width:100%;font:inherit;font-size:13px;font-weight:700;padding:9px 8px;border-radius:6px;border:1px dashed #8b1e2d;background:#fff;color:#8b1e2d;cursor:pointer;margin:-6px 0 14px}
.cbtn.active{background:#8b1e2d;color:#fff;border-style:solid}
#china-box{background:#fbf6f4;border:1px solid #f0dcd5;border-radius:8px;padding:12px;margin:-4px 0 14px}
#china-box h3{margin:0 0 8px;font-size:13px}
#china-box .stats{margin-bottom:8px}
#china-box .st{background:#fff}
#china-box .st .v.c{color:var(--nv)}
#china-box ul{list-style:none;margin:0 0 8px;padding:0;font-size:12.5px}
#china-box li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #f0e4df}
#china-box li span{color:var(--sub);white-space:nowrap}
#china-box .rleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);margin:6px 0}
#china-box .rleg i{display:inline-block;width:18px;height:0;border-top:3px dashed;vertical-align:3px;margin-right:4px}
#china-box .bt{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:#8a5a00;cursor:pointer;margin-top:6px}
#china-box .nt{font-size:11px;color:var(--mute);line-height:1.5;margin:6px 0 0}
@keyframes flow{to{stroke-dashoffset:-24}}
body.china .node{opacity:.12}
body.china .node.cn,body.china .node.onroute,body.china .node.jh,body.china .node.nv,body.china .node.cut{opacity:1}
body.china .node.gone{opacity:.08!important}
body.china .edge{stroke-opacity:.05}
body.china .edge.bedge{stroke:#c99600;stroke-opacity:.9;stroke-width:2;stroke-dasharray:3 3}
body.china .edge.route{stroke-opacity:1;stroke-width:2.8;stroke-dasharray:8 4;animation:flow 1.1s linear infinite}
body.china .edge.r-jh{stroke:var(--jen)}
body.china .edge.r-samr{stroke:#8b1e2d}
body.china .edge.r-us{stroke:#4a5a70}
body.china .edge.route.bedge{stroke:#c99600}
.edge.off{stroke-opacity:0!important}
body.china .lab{opacity:0}
body.china .lab.cnl,body.china .lab.rl,body.china .lab.jh,body.china .lab.nv,body.china .lab.cut{opacity:1}
body.china .lab.rl{fill:var(--ink);font-weight:700}
body.china .pt{visibility:hidden}
.blab{font-size:calc(10.5px * var(--s,1));font-weight:700;fill:#8a5a00;paint-order:stroke;stroke:#f5f6f8;stroke-width:calc(3px * var(--s,1));text-anchor:middle;pointer-events:none;display:none}
body.china:not(.boff) .blab{display:block}

/* 확대·축소 */
#net{touch-action:none;cursor:grab}
#net.grabbing{cursor:grabbing}
.zoom{position:fixed;right:376px;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.9);border:1px solid rgba(29,36,48,.12);border-radius:8px;padding:4px;box-shadow:0 4px 16px rgba(29,36,48,.08);z-index:4}
.zoom button{width:34px;height:34px;border:0;background:transparent;border-radius:6px;font:inherit;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1}
.zoom button:hover{background:#eef0f3}
.zoom button.fit{font-size:11px;font-weight:700}
.zoom #zoom-val{font-size:10.5px;color:var(--mute);padding:2px 0}
body.zoomed .lab{opacity:.9}
body.zoomed.china .lab{opacity:0}
body.zoomed.china .lab.cnl,body.zoomed.china .lab.rl,body.zoomed.china .lab.jh,body.zoomed.china .lab.nv,body.zoomed.china .lab.cut{opacity:1}
body.focusing.zoomed .lab,body.korea.zoomed .lab{opacity:.12}
body.focusing.zoomed .lab.fcl{opacity:1}
body.korea.zoomed .lab.krl{opacity:1}
@media (max-width:860px){
  .zoom{right:10px;bottom:auto;top:84px}
  .title{left:16px;top:14px;right:16px}
  .title h1{font-size:24px}
  .title p{display:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:42vh;padding:12px}
  .legend{display:none}
}

/* for_publish: 수치 숨김 */
.stats,#rm-desc,.lists,#china-box,#korea-box,#merge-box,#ex-card,#org-note,#aug-note,.zoom #zoom-val,#tip span:not(:first-of-type){display:none!important}
#rm-name{margin-bottom:12px}
.lang{display:flex;gap:4px;margin:0 0 12px;justify-content:flex-end}
.lang button{font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid #c7ccd4;background:#fff;color:#5b6472;cursor:pointer}
.lang button.on{background:#1d2430;border-color:#1d2430;color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script>

로<\/span><span><i style=\"color:#8b1e2d\"><\/i>조사받는 길<\/span><span><i style=\"color:#4a5a70\"><\/i>협상하는 길<\/span><\/div>\n    <div class=\"stats\">\n      <div class=\"st\"><div class=\"k\">지도부 4곳행 젠슨 경유<\/div><div class=\"v\" id=\"cn-via-jh\">—<\/div><\/div>\n      <div class=\"st\"><div class=\"k\">엔비디아 경유<\/div><div class=\"v c\" id=\"cn-via-nv\">—<\/div><\/div>\n    <\/div>\n    <label class=\"bt\"><input type=\"checkbox\" id=\"bedge-toggle\"> 감독총국→국무원 연결선(B등급) 빼고 보기<\/label>\n    <p class=\"nt\" id=\"cn-note\">지도부 4곳 = 허리펑·왕원타오·국무원·상무부. 경유 비율은 영역 밖 노드(행사·두 허브 제외)에서 4곳으로 가는 최단경로 중 해당 노드를 지나는 비율의 평균이다. 페이지가 현재 상태로 직접 계산한다. 시트 v5 기준 도달범위 감소는 젠슨 제거 −34.0%, 엔비디아 제거 −27.3%.<\/p>\n  <\/div>\n  <div id=\"rm-name\"><\/div>\n  <p id=\"rm-desc\"><\/p>\n  <div class=\"stats\">\n    <div class=\"st\"><div class=\"k\">연결 효율 감소<\/div><div class=\"v\" id=\"st-eff\">—<\/div><\/div>\n    <div class=\"st\"><div class=\"k\">사라진 연결선<\/div><div class=\"v\" id=\"st-edge\">—<\/div><\/div>\n    <div class=\"st\"><div class=\"k\">떨어져 나간 노드<\/div><div class=\"v\" id=\"st-cut\">—<\/div><\/div>\n    <div class=\"st\"><div class=\"k\">더 멀어진 노드<\/div><div class=\"v\" id=\"st-far\">—<\/div><\/div>\n  <\/div>\n  <div class=\"lists\">\n    <h3><i><\/i>본망에서 떨어져 나간 노드<\/h3>\n    <ul id=\"cut-list\"><\/ul>\n    <h3><i class=\"far\"><\/i><span id=\"far-title\">더 멀어진 노드<\/span><\/h3>\n    <ul id=\"far-list\"><\/ul>\n  <\/div>\n  <label class=\"lt\"><input type=\"checkbox\" id=\"layer-toggle\"> 연결선을 관계 유형별 색으로 보기<\/label>\n  <div id=\"legend-layers\"><\/div>\n  <div class=\"foot\">자료: SEC 공시, FEC 후원 기록, 재단 세무신고서(990-PF), 정부 발표, 기업 보도자료, 주요 언론 보도 · 기준일 2026년 11월 10일<br>연합인포맥스<\/div>\n<\/aside>\n\n<div class=\"legend\">\n  <span><b style=\"background:#1f4f9a;border-color:#1f4f9a\"><\/b>엔비디아 법인<\/span>\n  <span><b style=\"border-color:#d9590f;border-width:2.5px\"><\/b>젠슨 황<\/span>\n  <span><b><\/b>기업·인물<\/span>\n  <span><b style=\"border-style:dashed;border-color:#9aa3af\"><\/b>행사<\/span>\n  <span><b st const edges = DATA.edges.map(e => ({...e, off: !!e.past, a:byId[e.s], b:byId[e.t], curv:(Math.random()-.5)*0.55}));
edges.forEach(e => { e.a.deg++; e.b.deg++; });
const adj = new Map(nodes.map(n => [n.id, []]));
edges.forEach(e => { adj.get(e.s).push(e); adj.get(e.t).push(e); });
nodes.forEach(n => { n.r = n.id === NV ? 15 : n.id === JH ? 11 : n.t === 'event' ? 2.6 : 2.8 + Math.sqrt(n.deg) * 1.15; });

/* initial burst from centre */
nodes.forEach(n => { const a = Math.random()*Math.PI*2, r = 20 + Math.random()*40; n.x = Math.cos(a)*r; n.y = Math.sin(a)*r; });
byId[NV].x = 0; byId[NV].y = 0; byId[JH].x = 30; byId[JH].y = -20;

/* ---------- graph metrics ---------- */
const alive = n => !n.removed;
function bfs(src) {
  const dist = new Map([[src, 0]]), q = [src];
  for (let k = 0; k < q.length; k++) {
    const u = q[k];
    for (const e of adj.get(u)) {

      const v = e.s === u ? e.t : e.s;

}
function efficiency() {
  const live = nodes.filter(alive), N = live.length; let s = 0;
  for (const n of live) for (const [v, d] of bfs(n.id)) if (d > 0) s += 1 / d;
  return s / (N * (N - 1));
}
function components() {
  const seen = new Set(), comps = [];
  for (const n of nodes) {

    const c = [...bfs(n.id).keys()]; c.forEach(x => seen.add(x)); comps.push(c);

}
const MERGED = !!DATA.merged;
if (MERGED) byId[JH].removed = true;
const baseEff = efficiency();
const baseMain = new Set(components()[0]);
const baseDist = { [NV]: bfs(NV), [JH]: bfs(JH) };

/* ---------- svg ---------- */
const svg = document.getElementById('net');
const gEdge = mk('g'), gPart = mk('g'), gFx = mk('g'), gNode = mk('g'), gLab = mk('g');
[gEdge, gPart, gFx, gNode, gLab].forEach(g => svg.appendChild(g));
function mk(tag, attrs = {}, parent) { const el = document.createElementNS(SVGNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (parent) parent.appendChild(el); return el; }

edges.forEach(e => {
  const jen = e.s === JH || e.t === JH;
  e.el = mk('path', {class: 'edge' + (e.past ? ' past' : '') + (e.aug ? ' aug' : '') + (jen ? ' jen' : '') + (e.s === NV || e.t === NV ? ' nv' : '')}, gEdge);
  e.jen = jen || !!e.fromJ;
  if (e.fromJ) e.el.classList.add('jen');
});
nodes.forEach(n => {
  const g = mk('g', {class: 'node t-' + n.t + (n.id === JH ? ' jh' : '') + (n.id === NV ? ' nv' : '')}, gNode);
  mk('circle', {class: 'halo', r: n.r + 6}, g);
  mk('circle', {class: 'ring', r: n.r}, g);
  if (n.t !== 'event') mk('circle', {class: 'core', r: Math.max(1.1, n.r * 0.38)}, g);
  n.g = g;
  const show = KEY.has(n.id) || n.deg >= 7;

  n.lab.textContent = n.n;
  n.labOn = show;
  if (MERGED && n.id === JH) { g.style.display = 'none'; n.lab.style.display = 'none'; }

  on(g, 'mouseenter', () => hover(n));

});

/* particles */
const parts = Array.from({length: 46}, () => ({el: mk('circle', {class: 'pt', r: 1.4}, gPart), e: null, t: Math.random(), sp: 0.004 + Math.random() * 0.006}));
function pickEdge(p) { const live = edges.filter(e => !e.a.removed && !e.b.removed && !e.a.cut && !e.b.cut); p.e = live[(Math.random() * live.length) | 0]; p.t = 0; p.dir = Math.random() < .5; p.el.setAttribute('class', 'pt' + (p.e && p.e.jen ? ' jen' : '')); }
parts.forEach(pickEdge);

/* ---------- simulation ---------- */
let alpha = 1, t0 = performance.now(), mainR = 300;
const view = {x: -400, y: -300, w: 800, h: 600};
let followId = null, Z = 1, PX = 0, PY = 0, lastTgt = null, lastUser = 0, dragMoved = false;
function tick(now) {
  if (signal.aborted) return;
  const t = now - t0;
  alpha += ((0.025) - alpha) * 0.012;
  const live = nodes.filter(alive);
  // repulsion
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy + 0.01;
      if (d2 > 160000) continue;
      const f = (a.cut || b.cut ? 260 : 620) * (1 + (a.r + b.r) / 14) / d2 * alpha;
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  // springs
  for (const e of edges) {
    const a = e.a, b = e.b;
    if (a.removed || b.removed || e.off) continue;
    const hub = (a.id === NV || b.id === NV) ? 1.0 : 1.0;
    const L = 46 + 3.5 * Math.sqrt(Math.min(a.deg, b.deg) + Math.max(a.deg, b.deg) * 0.12) * hub;
    let dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const k = 0.035 * alpha * (d - L) / d;
    const wa = b.deg / (a.deg + b.deg), wb = 1 - wa;
    a.vx += dx * k * wa; a.vy += dy * k * wa; b.vx -= dx * k * wb; b.vy -= dy * k * wb;
  }
  koreaForce();
  // gravity, cut-off orbit, wander
  for (const n of live) {
    const d = Math.hypot(n.x, n.y) || 1;
    if (n.cut) {
      const target = mainR * 1.22, k = 0.02 * (target - d) / d;
      n.vx += n.x * k; n.vy += n.y * k;
    } else {
      n.vx -= n.x * 0.006 * alpha; n.vy -= n.y * 0.006 * alpha;
    }
    if (n.id === NV && !n.cut) { n.vx -= n.x * 0.02; n.vy -= n.y * 0.02; }
    n.vx += Math.sin(t * 0.00045 + n.phase) * 0.018;
    n.vy += Math.cos(t * 0.00038 + n.phase * 1.3) * 0.018;

    n.x += n.vx; n.y += n.vy;

    mainR += (ds[Math.floor(ds.length * 0.92)] - mainR) * 0.05;

}

function ctrl(e) {
  const a = e.a, b = e.b, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;

}
function render() {

  for (const n of nodes) { if (n.removed && !n.fading) continue; x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const W = svg.clientWidth || 1, H = svg.clientHeight || 1, pad = 40;
  const wide = window.innerWidth > 860;
  const panel = wide ? 360 : 0, topPad = wide ? 150 : 90, botPad = wide ? 40 : Math.min(H * 0.42, 330);
  const aw = W - panel, ah = H - topPad - botPad;
  const s0 = Math.max((x1 - x0 + pad * 2) / aw, (y1 - y0 + pad * 2) / ah);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;

  lastTgt = tgt;

    const f = byId[followId], vw = tgt.w / Z, vh = tgt.h / Z;
    fin = {w: vw, h: vh, x: f.x - (aw / 2) / W * vw, y: f.y - (topPad + ah / 2) / H * vh};
    PX = fin.x - (tgt.x + tgt.w / 2) + tgt.w / (2 * Z); PY = fin.y - (tgt.y + tgt.h / 2) + tgt.h / (2 * Z);

  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  const s = view.h / H;
  svg.style.setProperty('--s', s);

  for (const e of edges) {
    const [qx, qy] = ctrl(e);
    e.el.setAttribute('d', `M${e.a.x.toFixed(1)},${e.a.y.toFixed(1)}Q${qx.toFixed(1)},${qy.toFixed(1)} ${e.b.x.toFixed(1)},${e.b.y.toFixed(1)}`);
  }
  for (const n of nodes) {
    n.g.setAttribute('transform', `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    n.lab.setAttribute('x', (n.x + n.r + 4).toFixed(1));
    n.lab.setAttribute('y', (n.y + 3.5).toFixed(1));

    if (!p.e || p.e.a.removed || p.e.b.removed || p.e.a.cut || p.e.b.cut) { pickEdge(p); if (!p.e) continue; }
    p.t += p.sp; if (p.t > 1) pickEdge(p);

    p.el.setAttribute('cx', x.toFixed(1)); p.el.setAttribute('cy', y.toFixed(1));

}

/* ---------- interaction ---------- */
const tip = document.getElementById('tip');

  edges.forEach(e => e.el.classList.remove('hl'));
  if (!n) { tip.style.opacity = 0; return; }
  n.g.classList.add('me'); n.lab.classList.add('hv');
  const ls = new Set();
  for (const e of adj.get(n.id)) {
    const o = e.s === n.id ? e.b : e.a;
    if (o.removed) continue;
    o.g.classList.add('nb'); o.lab.classList.add('hv'); e.el.classList.add('hl'); e.l.forEach(l => ls.add(LAYER_KO[l] || l));
  }
  const live = adj.get(n.id).filter(e => !(e.s === n.id ? e.b : e.a).removed).length;
  tip.innerHTML = `<b>${n.n}</b><span>${TYPE_KO[n.t] || n.t}${n.c ? ' · ' + n.c : ''}${n.d ? ' · ' + n.d : ''}</span>${n.removed ? '<em>Removed · click to restore</em>' : n.cut ? '<em>Cut off from the network</em>' : '<em>Click to remove this node</em>'}`;
  const r = n.g.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - 250, r.right + 10) + 'px';
  tip.style.top = Math.max(8, r.top - 8) + 'px';

}

/* ---------- 확대·축소·이동 ---------- */
function finalView(t) {
  const zx = t.x + t.w / 2, zy = t.y + t.h / 2;
  return {w: t.w / Z, h: t.h / Z, x: zx - t.w / (2 * Z) + PX, y: zy - t.h / (2 * Z) + PY};
}
function zoomAt(f, sx, sy) {

  const nz = Math.min(8, Math.max(0.5, Z * f));

}
on(svg, 'wheel', ev => {

const ptrs = new Map(); let pinch0 = null, dragStart = null;
on(svg, 'pointerdown', ev => {
  ptrs.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  dragMoved = false; dragStart = {x: ev.clientX, y: ev.clientY};

on(window, 'pointermove', ev => {

const zb = (id, fn) => on(document.getElementById(id), 'click', fn);

zb('zoom-out', () => zoomAt(1 / 1.4, ...centerPt()));

function pulse(n) {
  const c = mk('circle', {class: 'pulse', cx: n.x, cy: n.y, r: n.r}, gFx);
  c.animate([{r: n.r, opacity: .9}, {r: n.r + 120, opacity: 0}], {duration: 1400, easing: 'cubic-bezier(.2,.7,.3,1)'}).onfinish = () => c.remove();
  const c2 = mk('circle', {class: 'pulse', cx: n.x, cy: n.y, r: n.r}, gFx);
  c2.animate([{r: n.r, opacity: .7}, {r: n.r + 60, opacity: 0}], {duration: 1100, delay: 180, easing: 'ease-out'}).onfinish = () => c2.remove();
}

function toggle(ids, forceState) {
  if (MERGED) ids = ids.filter(id => id !== JH);
  if (!ids.length) return;
  const target = ids.map(id => byId[id]);
  const removing = forceState !== undefined ? forceState : !target[0].removed;
  target.forEach(n => {
    if (n.removed === removing) return;
    if (removing) {
      pulse(n);
      adj.get(n.id).forEach(e => { e.el.classList.add('dying'); });
      n.g.classList.add('dying'); n.lab.classList.add('dying');
      setTimeout(() => { n.removed = true; n.g.classList.add('gone'); n.lab.classList.add('gone'); adj.get(n.id).forEach(e => { e.el.classList.remove('dying'); e.el.classList.add('gone'); }); update(); }, 700);
    } else {
      n.removed = false;
      n.g.classList.remove('gone', 'dying'); n.lab.classList.remove('gone', 'dying');
      adj.get(n.id).forEach(e => { if (!e.a.removed && !e.b.removed) e.el.classList.remove('gone', 'dying'); });
      n.x = (Math.random() - .5) * 40; n.y = (Math.random() - .5) * 40;
    }
  });
  if (!removing) update();
  alpha = 1;
}

function update() {
  const comps = components();
  const main = new Set(comps[0] || []);
  const removed = nodes.filter(n => n.removed && !(MERGED && n.id === JH));
  // reference hub for "farther" check
  let ref = null;
  if (!byId[NV].removed) ref = NV; else if (!byId[JH].removed) ref = JH;
  const dNow = ref ? bfs(ref) : null, dBase = ref ? baseDist[ref] : null;
  const cut = [], far = [];
  const crowd = nodes.filter(n => !n.removed && baseMain.has(n.id) && !main.has(n.id)).length > 8;
  nodes.forEach(n => {
    const wasCut = n.cut;
    n.cut = !n.removed && baseMain.has(n.id) && !main.has(n.id);
    if (n.cut && !wasCut) { n.vx += n.x * 0.05; n.vy += n.y * 0.05; }
    n.g.classList.toggle('cut', n.cut); n.lab.classList.toggle('cut', n.cut);
    n.lab.classList.toggle('on', n.labOn || n.cut);
    n.lab.classList.toggle('many', n.cut && crowd);
    n.far = 0;
    if (!n.removed && !n.cut && ref && dBase.has(n.id) && dNow.has(n.id) && dNow.get(n.id) > dBase.get(n.id)) {
      n.far = dNow.get(n.id) - dBase.get(n.id); far.push([n, dBase.get(n.id), dNow.get(n.id)]);
    }
    n.g.classList.toggle('far', n.far > 0);
    if (n.cut) cut.push(n);
  });
  edges.forEach(e => e.el.classList.toggle('cutedge', e.a.cut || e.b.cut));
  const effDrop = removed.length ? (1 - efficiency() / baseEff) * 100 : 0;
  const lostEdges = edges.filter(e => e.a.removed || e.b.removed).length;
  far.sort((a, b) => (b[2] - b[1]) - (a[2] - a[1]) || b[0].deg - a[0].deg);
  showPanel(removed, effDrop, lostEdges, cut, far, ref);
  if (typeof updateChina === 'function') updateChina();
}

/* ---------- panel ---------- */
const P = id => document.getElementById(id);
const PRESET = MERGED ? {
  [NV]: `A single hub merging Jensen and NVIDIA. Removing it deletes ${adj.get(NV).length} links.`,
} : MODE === 'org' ? {
  [JH]: `By organization, NVIDIA also reaches 21 of the ${adj.get(JH).length - 1} nodes Jensen reaches. Jensen’s own share is government, Chinese leadership, academia and personal ties.`,
  [NV]: `NVIDIA the company is the No. 1 hub. Removing it deletes ${adj.get(NV).length} links and cuts off suppliers and neoclouds.`,
} : {
  [JH]: 'Jensen is the No. 2 hub after NVIDIA (eigenvector 0.267, betweenness 0.334). Removing him deletes 33 links and lengthens paths to Chinese leadership.',
  [NV]: 'NVIDIA the company is the No. 1 hub (eigenvector 0.628). Removing it deletes 68 links and cuts off suppliers and neoclouds entirely.',
};
function showPanel(removed, effDrop, lostEdges, cut, far, ref) {

  P('st-far').textContent = removed.length && ref ? far.length : '—';

  let D = mode === 'org' ? (aug ? DATA_ORG_AUG : DATA_ORG) : (aug ? DATA_AUG : DATA);
  D = addExtra(D);
  if (merged) D = mergeJH(D);
  document.body.classList.toggle('merged', !!merged);
  const mb = document.getElementById('merge-toggle');
  mb.classList.toggle('active', !!merged);
  mb.textContent = merged ? 'Separate Jensen and NVIDIA again' : 'View Jensen = NVIDIA (merge into one)';
  document.getElementById('merge-box').hidden = !merged;
  document.querySelector('.sc.nv').textContent = merged ? 'Remove merged hub' : 'Remove NVIDIA';
  boot(D, mode, CTL.signal, aug, focus);
}
document.getElementById('org-toggle')['addEventListener']('click', () => start(CUR === 'org' ? 'base' : 'org', AUGON, null, MERGEON));
document.getElementById('merge-toggle')['addEventListener']('click', () => start(CUR, AUGON, null, !MERGEON));
document.getElementById('aug-toggle')['addEventListener']('change', e => {
  const act = document.querySelector('.ex.active');
  start(CUR, e.target.checked, act ? act.dataset.n : null, MERGEON);
});
document.getElementById('ex-list')['addEventListener']('click', e => {
  const b = e.target.closest('.ex.miss');
  if (b && !AUGON) { document.getElementById('aug-toggle').checked = true; start(CUR, true, b.dataset.n, MERGEON); }
});
start('base', false);

}
(function(){
  const L = (location.hash === '#en') ? 'en' : 'ko';
  document.documentElement.lang = L;
  document.title = L === 'en' ? '[Jensen Huang Network] Removing Jensen' : '[젠슨 황 네트워크] 젠슨을 지우면';
  document.getElementById('root').innerHTML = BODY[L];
  document.querySelectorAll('.lang button').forEach(b => {
    b.classList.toggle('on', b.dataset.l === L);
    b.addEventListener('click', () => { if (b.dataset.l === L) return; location.hash = b.dataset.l; location.reload(); });
  });
  const d = D[L];
  (L === 'en' ? APP_EN : APP_KO)(d.DATA, d.DATA_ORG, d.DATA_AUG, d.DATA_ORG_AUG);
})();
</script>
